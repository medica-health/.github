name: cdac

x-db-env: &db-env
  MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017/cdac_db?authSource=admin

# Shared by both APIs: spring-api issues JWTs, express-api verifies them (same secret).
# Put RESEND_API_KEY (and optionally JWT_SECRET, MAIL_FROM) in a workspace-root .env file.
x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
  JWT_ISSUER: cdac-auth
  JWT_AUDIENCE: cdac-api
  # Email via Resend. Without RESEND_API_KEY, emails are only logged by the APIs.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-MediCare <onboarding@resend.dev>}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  APP_BASE_URL: http://localhost:3000

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PostgreSQL 16 + PostGIS (doctor "near me" search). Same data layout as postgres:16-alpine,
  # so an existing postgres_data volume keeps working.
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cdac_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cdac_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis: slot holds, free-slot cache and rate limiting for express-api. Ephemeral by design
  # (holds last minutes, the cache is rebuilt from Postgres), so no volume or persistence.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  spring-api:
    build: ./spring-api
    restart: unless-stopped
    environment:
      <<: [*db-env, *app-env]
      PORT: 8080
      APP_ENV: production
      DB_URL: jdbc:postgresql://postgres:5432/cdac_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    # Ready once Flyway has created the auth schema and the app is up.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\r\n\r\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  express-api:
    build: ./express-api
    restart: unless-stopped
    environment:
      <<: [*db-env, *app-env]
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/cdac_db
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # express-api's migrations reference auth.users, created by spring-api's Flyway
      spring-api:
        condition: service_healthy

  client:
    build:
      context: ./client-side
      args:
        # Used by the browser, so these must be host-reachable URLs
        NEXT_PUBLIC_SPRING_API_URL: http://localhost:8080
        NEXT_PUBLIC_EXPRESS_API_URL: http://localhost:5000
    restart: unless-stopped
    environment:
      # Used by Next.js server code (server components / route handlers) inside the Docker network
      SPRING_API_URL: http://spring-api:8080
      EXPRESS_API_URL: http://express-api:5000
    ports:
      - "3000:3000"
    depends_on:
      - spring-api
      - express-api

volumes:
  mongo_data:
  postgres_data:
