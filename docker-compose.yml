name: cdac

x-db-env: &db-env
  MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017/cdac_db?authSource=admin

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cdac_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cdac_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  spring-api:
    build: ./spring-api
    restart: unless-stopped
    environment:
      <<: *db-env
      PORT: 8080
      APP_ENV: production
      DB_URL: jdbc:postgresql://postgres:5432/cdac_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  express-api:
    build: ./express-api
    restart: unless-stopped
    environment:
      <<: *db-env
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/cdac_db
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client-side
      args:
        # Used by the browser, so these must be host-reachable URLs
        NEXT_PUBLIC_SPRING_API_URL: http://localhost:8080
        NEXT_PUBLIC_EXPRESS_API_URL: http://localhost:5000
    restart: unless-stopped
    environment:
      # Used by Next.js server code (server components / route handlers) inside the Docker network
      SPRING_API_URL: http://spring-api:8080
      EXPRESS_API_URL: http://express-api:5000
    ports:
      - "3000:3000"
    depends_on:
      - spring-api
      - express-api

volumes:
  mongo_data:
  postgres_data:
